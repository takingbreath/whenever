<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3F3F1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Whenever">
  <title>Pair with Whenever</title>
  <link rel="manifest" href="/pair/__TOKEN__/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="preload" href="/fonts/schibsted-grotesk.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face { font-family: "Schibsted Grotesk"; src: url("/fonts/schibsted-grotesk.woff2") format("woff2"); font-weight: 400 900; font-display: swap; }
    :root {
      --ground: #f3f3f1; --surface: #ffffff; --ink: #17181c; --ink-2: #55575f; --line: rgba(23, 24, 28, 0.1);
      --indigo: #3346d3; --ok: #0b7a57; --warn: #9a5b00; color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root { --ground: #101114; --surface: #1b1c21; --ink: #f2f2f0; --ink-2: #a9abb3; --line: rgba(255, 255, 255, 0.1);
        --indigo: #6f7dff; --ok: #3fc495; --warn: #f2b34a; color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; background: var(--ground); color: var(--ink);
      font: 17px/1.5 "Schibsted Grotesk", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    main { max-width: 440px; margin: 0 auto; padding: max(28px, env(safe-area-inset-top)) 20px 40px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; margin-bottom: 36px; }
    .brand i { width: 26px; height: 26px; border-radius: 8px; background: #3346d3;
      box-shadow: inset 0 0 0 5px #3346d3, inset 0 0 0 7.5px #fff; }
    h1 { margin: 0 0 10px; font-size: 30px; line-height: 1.12; letter-spacing: -0.02em; font-weight: 800; text-wrap: balance; }
    p { margin: 0 0 14px; color: var(--ink-2); }
    .lead { font-size: 18px; }
    .button { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 56px; margin: 22px 0 10px;
      padding: 14px 22px; border: 0; border-radius: 999px; background: var(--indigo); color: #fff; font: inherit; font-weight: 800;
      font-size: 18px; text-decoration: none; cursor: pointer; }
    .button:active { transform: scale(0.985); }
    .button[disabled] { opacity: 0.6; }
    .button.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); font-size: 16px; min-height: 48px; }
    .steps { margin: 22px 0 0; padding: 0; list-style: none; counter-reset: step; display: grid; gap: 14px; }
    .steps li { counter-increment: step; position: relative; padding: 14px 16px 14px 58px; border-radius: 18px; background: var(--surface); }
    .steps li::before { content: counter(step); position: absolute; left: 16px; top: 13px; width: 28px; height: 28px; border-radius: 50%;
      display: grid; place-items: center; background: var(--indigo); color: #fff; font-weight: 800; font-size: 15px; }
    .steps b { display: block; color: var(--ink); }
    .steps span { color: var(--ink-2); font-size: 15px; }
    .glyph { display: inline-block; width: 20px; height: 20px; vertical-align: -4px; color: var(--indigo); }
    .mark { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; margin-bottom: 20px; }
    .mark.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
    .mark.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
    .mark svg { width: 32px; height: 32px; }
    .spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.4); border-top-color: #fff; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }
    .small { font-size: 14px; }
    .error { color: #c42b26; font-weight: 600; }
    code { font: 14px ui-monospace, monospace; word-break: break-all; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><i aria-hidden="true"></i>Whenever</div>
    <div id="view" aria-live="polite"><p>Opening</p></div>
  </main>
  <script src="/pair.js"></script>
</body>
</html>
