# Runs the offline unit tests on Linux, where the Landlock and seccomp jail tests also run.
# The tests need no Meta API key and make no paid call.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install ffmpeg and Python's venv
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg python3-venv
      # The system Python 3.12, as on the server. A rule's jail can read only the system folders, so a
      # Python from elsewhere, such as actions/setup-python in /opt, could not load its own library there.
      - name: Install the libraries
        run: python3 -m venv .venv && .venv/bin/pip install -q -r requirements.txt
      - name: Run the unit tests
        run: .venv/bin/python -m unittest discover tests
