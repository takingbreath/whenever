<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#000;font-family:Figtree,sans-serif;color:#fff;position:relative}
.frame{position:absolute;inset:0;background:#2b3138}
.sky{position:absolute;left:0;right:0;top:0;height:300px;background:#4a5562}
.wall{position:absolute;left:0;right:0;top:300px;height:120px;background:#6d6a62}
.gate{position:absolute;left:40px;top:250px;width:150px;height:170px;background:#7a5a3a;border:6px solid #3a2a1c}
.road{position:absolute;left:0;right:0;top:420px;bottom:0;background:#3b3f44}
.car{position:absolute;left:150px;top:470px;width:190px;height:78px;border-radius:22px 26px 10px 10px;background:#eef0f2}
.box{position:absolute;left:138px;top:456px;width:214px;height:106px;border:3px solid #FF3B30;border-radius:8px}
.top{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;font-weight:800;font-size:16px}
.alert{background:#FF3B30;border-radius:999px;padding:4px 12px;font-size:13px}
.scrim{position:absolute;left:0;right:0;bottom:0;height:300px;background:rgba(0,0,0,.55)}
.cap{position:absolute;left:18px;right:96px;bottom:104px}
.who{font-weight:800;font-size:16px;margin-bottom:8px}
.txt{font-weight:800;font-size:26px;line-height:1.15}
.facts{font-size:14px;opacity:.85;margin-top:10px}
.rail{position:absolute;right:14px;bottom:110px;display:flex;flex-direction:column;gap:18px;align-items:center}
.btn{width:56px;text-align:center;font-size:12px;font-weight:600}
.btn b{display:block;width:48px;height:48px;margin:0 auto 6px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid #fff}
.btn.ok b{background:#fff}
.tabs{position:absolute;bottom:0;left:0;right:0;height:78px;background:#000;display:flex;justify-content:space-around;align-items:center;padding-bottom:12px;border-top:1px solid #222}
.tab{font-size:12px;opacity:.7;text-align:center;width:64px}
.tab b{display:block;width:22px;height:22px;margin:0 auto 4px;border:2px solid #fff;border-radius:6px}
.tab.on{opacity:1}.tab.on b{background:#fff}
.plus{width:52px;height:36px;border-radius:10px;background:#fff;color:#000;font-size:26px;display:flex;align-items:center;justify-content:center}
</style></head><body>
<div class="frame"><div class="sky"></div><div class="wall"></div><div class="gate"></div><div class="road"></div><div class="car"></div><div class="box"></div></div>
<div class="top"><span>Activity</span><span class="alert">1 of 4 new</span></div>
<div class="scrim"></div>
<div class="cap"><p class="who">Gate wide · 11:57</p><p class="txt">A car has blocked the gate for 5 minutes</p><p class="facts">Checked on 3 frames · light on · phone alerted</p></div>
<div class="rail"><span class="btn ok"><b></b>Right</span><span class="btn"><b></b>Wrong</span><span class="btn"><b></b>Light</span><span class="btn"><b></b>Share</span></div>
<div class="tabs"><span class="tab"><b></b>Live</span><span class="tab"><b></b>Whenevers</span><span class="plus">+</span><span class="tab on"><b></b>Activity</span><span class="tab"><b></b>Actions</span></div>
</body></html>
