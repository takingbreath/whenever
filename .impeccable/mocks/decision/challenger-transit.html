<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#14234A;font-family:'Hanken Grotesk',sans-serif;color:#F4F1E8}
.bar{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid rgba(244,241,232,.15)}
.brand{font-weight:800;font-size:22px}
.spend{font-size:13px;opacity:.8}
h1{font-weight:800;font-size:30px;padding:22px 18px 4px}
.sub{font-size:14px;opacity:.75;padding:0 18px 20px}
.line{position:relative;margin:0 18px 26px;padding:14px 0 0}
.name{font-weight:800;font-size:20px;margin-bottom:16px;padding-left:4px}
.track{position:relative;height:16px;margin:0 10px}
.track:before{content:"";position:absolute;left:0;right:0;top:5px;height:6px;border-radius:3px;background:var(--c)}
.st{position:absolute;top:-3px;width:22px;height:22px;border-radius:50%;background:#F4F1E8;border:5px solid var(--c)}
.st.x{width:26px;height:26px;top:-5px;border-width:6px;background:#14234A;box-shadow:0 0 0 3px #F4F1E8}
.labels{display:flex;justify-content:space-between;margin-top:12px;font-size:13px;opacity:.9}
.labels span{width:80px}
.labels span:last-child{text-align:right}
.live{display:inline-block;margin-left:8px;background:#D7392B;color:#fff;font-size:12px;font-weight:800;border-radius:4px;padding:2px 6px;vertical-align:middle}
.tabs{position:absolute;bottom:0;left:0;right:0;height:78px;background:#0f1a38;border-top:1px solid rgba(244,241,232,.12);display:flex;justify-content:space-around;align-items:center;padding-bottom:12px}
.tab{font-size:12px;opacity:.75;text-align:center;width:64px}
.tab b{display:block;width:22px;height:22px;margin:0 auto 4px;border:2px solid #F4F1E8;border-radius:50%}
.tab.on{opacity:1}.tab.on b{background:#F4F1E8}
.plus{width:56px;height:56px;border-radius:50%;background:#F4F1E8;color:#14234A;font-size:32px;display:flex;align-items:center;justify-content:center;margin-top:-26px}
</style></head><body>
<div class="bar"><span class="brand">Whenever</span><span class="spend">$0.42 today</span></div>
<h1>My Whenevers</h1>
<p class="sub">Each line runs from a trigger to its actions</p>
<div class="line" style="--c:#D7392B"><p class="name">Car blocks the gate <span class="live">FIRED</span></p>
<div class="track"><i class="st" style="left:0"></i><i class="st" style="left:38%"></i><i class="st x" style="left:70%"></i><i class="st x" style="right:0"></i></div>
<div class="labels"><span>Gate wide</span><span>5 min</span><span>Phone</span><span>Light</span></div></div>
<div class="line" style="--c:#2F62D8"><p class="name">Table 4 waits</p>
<div class="track"><i class="st" style="left:0"></i><i class="st" style="left:46%"></i><i class="st x" style="right:0"></i></div>
<div class="labels"><span>Café floor</span><span>no staff 5 min</span><span>Phone</span></div></div>
<div class="line" style="--c:#E7A52B"><p class="name">Monday busy hours</p>
<div class="track"><i class="st" style="left:0"></i><i class="st" style="left:46%"></i><i class="st x" style="right:0"></i></div>
<div class="labels"><span>Mon 9:00</span><span>journal</span><span>Report</span></div></div>
<div class="line" style="--c:#2E9B5E"><p class="name">Parcel at the door</p>
<div class="track"><i class="st" style="left:0"></i><i class="st x" style="right:0"></i></div>
<div class="labels"><span>Side</span><span>Phone</span></div></div>
<div class="tabs"><span class="tab"><b></b>Live</span><span class="tab on"><b></b>Lines</span><span class="plus">+</span><span class="tab"><b></b>Activity</span><span class="tab"><b></b>Actions</span></div>
</body></html>
