<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#fff;font-family:'Nunito Sans',sans-serif;color:#111}
.bar{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.brand{font-weight:900;font-size:22px}
.av{width:34px;height:34px;border-radius:50%;background:#eee}
h1{font-weight:900;font-size:34px;padding:12px 18px 16px}
.card{margin:0 18px 14px;border-radius:14px;padding:18px;color:#fff;position:relative}
.icons{display:flex;gap:8px;margin-bottom:14px}
.icons b{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.3)}
.title{font-weight:900;font-size:22px;line-height:1.2;padding-right:60px}
.meta{font-size:13px;margin-top:12px;opacity:.9}
.sw{position:absolute;top:18px;right:18px;width:46px;height:26px;border-radius:13px;background:rgba(255,255,255,.95)}
.sw:after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#111}
.create{position:absolute;bottom:100px;left:18px;right:18px;height:56px;border-radius:999px;background:#111;color:#fff;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center}
.tabs{position:absolute;bottom:0;left:0;right:0;height:78px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;align-items:center;padding-bottom:12px}
.tab{font-size:12px;color:#777;text-align:center;width:64px}
.tab b{display:block;width:22px;height:22px;margin:0 auto 4px;border:2px solid #777;border-radius:6px}
.tab.on{color:#111}.tab.on b{border-color:#111;background:#111}
</style></head><body>
<div class="bar"><span class="brand">Whenever</span><span class="av"></span></div>
<h1>My Whenevers</h1>
<div class="card" style="background:#2C7BE5"><div class="icons"><b></b><b></b></div><span class="sw"></span><p class="title">If a car blocks the gate for 5 minutes, then alert my phone</p><p class="meta">Gate wide · ran 3 times</p></div>
<div class="card" style="background:#F5A623"><div class="icons"><b></b><b></b></div><span class="sw"></span><p class="title">If table 4 waits 5 minutes, then alert my phone</p><p class="meta">Café floor · watching</p></div>
<div class="card" style="background:#222"><div class="icons"><b></b><b></b></div><span class="sw"></span><p class="title">Every Monday at 9:00, send me the busy hours</p><p class="meta">Schedule · next Monday</p></div>
<div class="create">Create</div>
<div class="tabs"><span class="tab"><b></b>Explore</span><span class="tab on"><b></b>My Whenevers</span><span class="tab"><b></b>Activity</span><span class="tab"><b></b>Actions</span></div>
</body></html>
